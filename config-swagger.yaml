                        dbaName: ACME STORE #9871
                        legalName: The ACME Company
                        businessRegistrationNumber: '874980284894473'
                        businessRegistrationNumberType: EIN
                        mcc: '4457'
                        email: customer@domain.com
                        url: customerservice.com
                        businessLegalType:
                          code: SOLE_PROPRIETOR
