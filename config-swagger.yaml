  /v1/party/agreements:
    post:
      tags:
        - Parties Boarding Endpoint Definition
      x-group-name: 'Parties'
      x-proxy-name: 'Agreements'
      summary: Manage party agreements including disclosure, terms of service, and signature.
      description: >-
        Use this API to manage party agreements. The agreementType field determines the action performed:
        DISCLOSURE - Retrieve the disclosure text for a party including important terms, conditions, and regulatory information.
        TERMSOFSERVICE - Accept terms of service for acquiring or payouts and return the PDF document stream with documentId.
        SIGNATURE - Add signature to a terms of service document with signer information including name and IP address.
      parameters:
        - name: Client-Id
          in: header
          description: Unique identifier for the client.
          required: true
          schema:
            type: string
        - name: User-Id
          in: header
          description: Unique identifier for the user.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyAgreementRequest'
            examples:
              Disclosure:
                summary: Retrieve the disclosure text for a party
                value:
                  agreementType: "DISCLOSURE"
                  partyId: "10000090000000087"
                  country: "US"
                  language: "en"
              Terms of Service:
                summary: Accept terms of service for acquiring or payouts
                value:
                  agreementType: "TERMSOFSERVICE"
                  partyId: "10000090000000087"
                  type: "acquiring"
              Signature:
                summary: Add signature to a terms of service document
                value:
                  agreementType: "SIGNATURE"
                  partyId: "10000090000000087"
                  documentId: "tos_acq_20260117_1234567890"
                  signature:
                    name: "John Doe"
                    ipAddress: "192.168.1.1"
      responses:
        '200':
          description: Agreement operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAgreementResponse'
              examples:
                DISCLOSURE:
                  summary: Response for agreementType DISCLOSURE
                  value:
                    agreementType: "DISCLOSURE"
                    disclosure:
                      disclosureText: |
                        IMPORTANT DISCLOSURE INFORMATION

                        This disclosure contains important information about your account, fees, and terms of service.
                        Please read carefully and retain for your records.

                        1. Processing Fees: Transaction fees apply based on your agreement.
                        2. Payout Schedule: Funds are transferred according to your selected schedule.
                        3. Liability: You are responsible for all transactions processed through your account.
                        4. Compliance: You must comply with all applicable laws and regulations.
                      version: "1.0"
                      effectiveDate: "2026-01-01"
                      lastUpdated: "2026-01-15T08:00:00Z"
                TERMSOFSERVICE:
                  summary: Response for agreementType TERMSOFSERVICE
                  value:
                    agreementType: "TERMSOFSERVICE"
                    termsOfService:
                      documentId: "tos_acq_20260117_1234567890"
                      type: "acquiring"
                      acceptedAt: "2026-01-17T10:30:00Z"
                      documentContent: "JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3Ro..."
                SIGNATURE:
