  /v1/party/configuration-inquiry:
    post:
      tags:
        - Parties Boarding Endpoint Definition
      x-group-name: 'Parties'
      x-proxy-name: 'Configuration'
      summary: Retrieve party configuration data.
      description: >-
        Use this API to retrieve various party configuration data such as supported countries,
        payout countries, party types, organization types, MCC codes, available payout products,
        country-specific address field schemas, and country-specific tender instrument schemas.
        The configurationType field in the request body determines which configuration data is returned.
      parameters:
        - name: Client-Id
          in: header
          description: Unique identifier for the client.
          required: true
          schema:
            type: string
        - name: User-Id
          in: header
          description: Unique identifier for the user.
          required: true
          schema:
            type: string
      requestBody:
        required: true
