                            dateOfBirth: '1990-01-01'
                            phone:
                              - countryCode: USA
                                phoneNumber: '+14045555678'
                                preference: PRIMARY
                                type: MOBILE
                          address:
                            street: 456 Elm Street
                            city: Atlanta
                            stateOrProvince: GA
                            postalCode: 30301-0001
                      taxProfile:
                        taxFilingName: The ACME Company
                        taxId: '123-45-7890'
                        taxIdType: EIN
                        issuingCountry: US
                      compliance:
                        termsAndConditionsVersion: v1
                        consentTimestamp: '2026-01-01T12:00:00Z'
                        consentBy: Joe Smith
