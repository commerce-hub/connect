openapi: 3.0.1
info:
  title: Party Boarding APIs
  version: v 1.1
  x-countryValidations:
    description: >-
      Several fields are subject to country-specific validation rules enforced at runtime
      in addition to the base constraints documented here. These rules vary by the party's
      registered country and cover allowed values, formats, and patterns. The following
      fields are affected:
    fields:
      - field: party.business.registeredAddress.postalCode
        description: >-
          Required for most countries. Format is country-specific (e.g. 5-digit numeric
          for USA; alphanumeric for GBR, CAN, AUS). Invalid formats produce FIELD_PATTERN_MISMATCH.
      - field: party.business.registeredAddress.country
        description: >-
          Required completeness field for Business parties — produces FIELD_REQUIRED when
          absent. ISO-3166-1 alpha-3 country code; invalid formats produce
          FIELD_PATTERN_MISMATCH.
      - field: party.business.registeredAddress.stateOrProvince
        description: >-
          Required for countries with defined administrative divisions. Accepted values
          are country-specific enums (e.g. US state codes, Canadian provinces, Australian
          states, Indian states). Invalid values produce FIELD_INVALID_ENUM.
        countriesCovered: [USA, CAN, AUS, GBR, DEU, IND, BRA, FRA, IRL, ITA, MEX, NLD, JPN, CHE, MYS, NZL, THA, TWN, VNM, BGD, CHN]
      - field: party.business.businessRegistrationNumberType
        description: >-
          Accepted values are country-specific (e.g. EIN for USA, BN/GST/HST for CAN,
          VAT/UTR for GBR). Invalid values produce FIELD_INVALID_ENUM.
      - field: party.business.businessLegalType.code
        description: >-
          Accepted values are country-specific legal entity type codes (e.g. SOLE_PROPRIETOR,
          LLC, CORPORATION). Invalid values produce FIELD_INVALID_ENUM.
      - field: party.taxProfile.taxIdType
        description: >-
          Accepted values are country-specific (e.g. SSN/EIN/ITIN for USA, BN/GST/HST for
          CAN, VAT/UTR for GBR, ABN/TFN for AUS, PAN/GST/TAN for IND). Invalid values
          produce FIELD_INVALID_ENUM.
      - field: party.taxProfile.taxId
        description: >-
          Format and length are validated per country and taxIdType combination at runtime.
      - field: party.business.phone.countryCode
        description: >-
          Must use the same country code standard as party.country (ISO-3166-1 alpha-3).
          For Business phone validation, countryCode must exactly match party.country.
          Mismatch produces FIELD_MISMATCH.
      - field: party.owners.individual.phone.countryCode
        description: >-
          Owner phone countryCode supports any valid ISO-3166-1 alpha-3 value and is not
          required to match party.country.
      - field: party.business.phone.phoneNumber
        description: >-
          Must be a full E.164 number including the country dialing prefix (for example,
          +14045551234). Invalid values produce FIELD_PATTERN_MISMATCH.
      - field: party.owners.individual.phone.phoneNumber
        description: >-
          Must be a full E.164 number including the country dialing prefix. Invalid
          values produce FIELD_PATTERN_MISMATCH.
servers:
  - url: https://connect-dev.fiservapis.com/unified/api/ffp/
  - url: https://connect-qa.fiservapis.com/unified/api/ffp/
  - url: https://connect-uat.fiservapis.com/unified/api/ffp/
  - url: https://connect-cert.fiservapis.com/unified/api/ffp/
  - url: https://connect.fiservapis.com/unified/api/ffp/
    description: Generated server url
paths:
  /v1/party/onboard:
    post:
      tags:
        - Parties Boarding Endpoint Definition
      x-group-name: 'Parties'
      x-proxy-name: 'Boarding'
      summary: Submit party information.
      description: >-
        Use this API to facilitate processing parties boarding configuration.
        CREATE, UPDATE, and REPLACE process party data persistence.
        PROVISION only requires party.partyId and starts the Party Boarding Step Function.
        KYB and KYC only require party.partyId and trigger a manual MRD KYB/KYC submission;
        all other party fields are ignored. Both return transactionState=PENDING — the
        terminal state arrives asynchronously via the listener service (DynamoDB stream →
        Kafka → MRD postback). Callers should poll /v1/party/inquire for the terminal outcome.
        Any other fields in party are ignored for PROVISION, KYB, and KYC.
      parameters:
        - name: Client-Id
          in: header
          description: Unique identifier for the client.
          required: true
          schema:
            type: string
        - name: User-Id
          in: header
          description: Unique identifier for the user.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartySaveRequest'
            examples:
              CREATE:
                summary: Create a new party (minimum required fields)
                value:
                  transactionDetails:
                    operationType: "CREATE"
                  party:
                    type: "BUSINESS"
                    country: "USA"
                    email: "party@example.com"
                    platform:
                      merchantPartyId: "merchant-001"
              UPDATE:
                summary: Update an existing party
                value:
                  transactionDetails:
                    operationType: "UPDATE"
                  party:
                    partyId: "100000900000001"
              UPDATE_VALID_BUSINESS_PHONE:
                summary: Update with valid Business phone (countryCode matches party.country and E.164 phoneNumber)
                value:
                  transactionDetails:
                    operationType: "UPDATE"
                  party:
                    partyId: "100000900000001"
                    country: "USA"
                    business:
                      phone:
                        countryCode: "USA"
                        phoneNumber: "+14045551234"
                        preference: "PRIMARY"
                        type: "DAY"
              UPDATE_INVALID_BUSINESS_PHONE_COUNTRY:
                summary: Invalid update - Business phone countryCode differs from party.country
                value:
                  transactionDetails:
                    operationType: "UPDATE"
                  party:
                    partyId: "100000900000001"
                    country: "USA"
                    business:
                      phone:
                        countryCode: "CAN"
                        phoneNumber: "+14045551234"
              UPDATE_INVALID_PHONE_E164:
                summary: Invalid update - phoneNumber is not valid E.164
                value:
                  transactionDetails:
                    operationType: "UPDATE"
                  party:
                    partyId: "100000900000001"
                    country: "USA"
                    business:
                      phone:
                        countryCode: "USA"
                        phoneNumber: "404-555-1234"
              REPLACE:
                summary: Replace an existing party
                value:
                  transactionDetails:
                    operationType: "REPLACE"
                  party:
                    partyId: "100000900000001"
              PROVISION:
                summary: Start party boarding workflow for an existing party
                value:
                  transactionDetails:
                    operationType: "PROVISION"
                  party:
                    partyId: "10000090000000087"
              KYB:
                summary: Manually submit KYB for an existing party
                value:
                  transactionDetails:
                    operationType: "KYB"
                  party:
                    partyId: "104604000032494"
              KYC:
                summary: Manually submit KYC for an existing party
                value:
                  transactionDetails:
                    operationType: "KYC"
                  party:
                    partyId: "104604000032494"
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartySaveResponse'
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
              examples:
                BUSINESS_PHONE_COUNTRY_MISMATCH:
                  summary: Business phone countryCode does not match party.country
                  value:
                    error:
                      - type: "BAD_REQUEST"
                        code: "400"
                        field: "party.business.phone.countryCode"
                        message: "Field [party.business.phone.countryCode] must match party.country"
                PHONE_E164_PATTERN_MISMATCH:
                  summary: phoneNumber is not a valid full E.164 number
                  value:
                    error:
                      - type: "BAD_REQUEST"
                        code: "400"
                        field: "party.business.phone.phoneNumber"
                        message: "Field [party.business.phone.phoneNumber] does not match required pattern [E.164 phone number including country code prefix]"
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        408:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeout'
        415:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedMediaType'
        425:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooEarly'
        429:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequest'
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        503:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
        504:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeout'

  /v1/party/inquire:
