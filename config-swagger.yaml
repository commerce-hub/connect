                  value:
                    errors:
                      pendingBoardingSteps:
                        - stepType: PHONE_VERIFICATION
                          status: AWAITING_ACTION
                          owner:
                            ownerId: '1234567890'
                          actions:
                            - actionId: '1234567890'
                              code: VERIFY_PHONE
                        - stepType: KYB
                          status: AWAITING_ACTION
                          statusMessage: 'Please upload one document from each group. Each group contains multiple options—choose any one per group.'
                          actions:
                            - actionId: '0987654321'
                              code: SUBMIT_KYB
