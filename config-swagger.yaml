  /v1/party/configuration:
    put:
      tags:
        - Parties Boarding Endpoint Definition
      x-group-name: 'Parties'
      x-proxy-name: 'Configuration'
      summary: Replace party configuration data (full replace).
      description: >-
        Use this API to fully replace a configuration collection for the client.
        All existing entries for the given configurationType are removed and replaced with the provided list.
        The configurationType field in the request body determines which configuration data is replaced.
        Supported configurationTypes: COUNTRIES, PAYOUT_COUNTRIES, PARTY_TYPES, ORGANIZATION_TYPES, MCC, AVAILABLE_TENDERS.
        COUNTRY_ADDRESS is read-only and returns 400 for PUT requests.
      parameters:
        - name: Client-Id
          in: header
          description: Unique identifier for the client.
          required: true
          schema:
            type: string
        - name: User-Id
          in: header
          description: Unique identifier for the user.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyConfigurationRequest'
            examples:
              Replace Countries:
                summary: Fully replace the supported countries list
                value:
                  configurationType: "COUNTRIES"
                  countries:
                    - code: "US"
                      name: "United States of America"
                      currency: "USD"
                    - code: "GBR"
                      name: "United Kingdom"
                      currency: "GBP"
              Replace Payout Countries:
                summary: Fully replace the payout countries list
                value:
                  configurationType: "PAYOUT_COUNTRIES"
                  payoutCountries:
                    - code: "US"
                      name: "United States of America"
                      currency: "USD"
              Replace Party Types:
                summary: Fully replace the supported party types
                value:
                  configurationType: "PARTY_TYPES"
                  partyTypes:
                    - "INDIVIDUAL"
                    - "BUSINESS"
              Replace Organization Types:
                summary: Fully replace organization types
                value:
                  configurationType: "ORGANIZATION_TYPES"
                  organizationTypes:
                    - country: "US"
                      types:
                        - key: "sole-proprietor"
                          displayText: "Sole Proprietor"
                        - key: "llc"
                          displayText: "Limited Liability Company (LLC)"
              Replace MCC List:
                summary: Fully replace the MCC list
                value:
                  configurationType: "MCC"
                  mccList:
                    - mcc: "5411"
                      description: "Grocery Stores, Supermarkets"
                    - mcc: "5812"
                      description: "Eating Places, Restaurants"
      responses:
        '200':
          description: Configuration replaced and current state returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyConfigurationResponse'
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

    patch:
      tags:
        - Parties Boarding Endpoint Definition
      x-group-name: 'Parties'
      x-proxy-name: 'Configuration'
      summary: Update party configuration data (partial update).
      description: >-
        Use this API to partially update a configuration collection for the client.
        Only the entries provided in the request are added or updated; existing entries not included in the request are preserved.
        The configurationType field in the request body determines which configuration data is updated.
        Supported configurationTypes: COUNTRIES, PAYOUT_COUNTRIES, PARTY_TYPES, ORGANIZATION_TYPES, MCC, AVAILABLE_TENDERS.
        COUNTRY_ADDRESS is read-only and returns 400 for PATCH requests.
      parameters:
        - name: Client-Id
          in: header
          description: Unique identifier for the client.
          required: true
          schema:
            type: string
        - name: User-Id
          in: header
          description: Unique identifier for the user.
