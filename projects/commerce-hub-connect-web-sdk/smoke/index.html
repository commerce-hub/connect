<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CommerceHub Connect Web SDK Smoke Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", sans-serif;
        --ink: #122033;
        --muted: #5c6b7a;
        --border: rgba(18, 32, 51, 0.12);
        --surface: #ffffff;
        --success: #047857;
        --danger: #b42318;
        --success-soft: rgba(4, 120, 87, 0.12);
        --danger-soft: rgba(180, 35, 24, 0.12);
        --shadow: 0 18px 48px rgba(18, 32, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(10, 93, 255, 0.12), transparent 28%),
          linear-gradient(180deg, #f4f7fb 0%, #edf2f7 100%);
      }

      main {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
        display: grid;
        gap: 20px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .summary {
        display: grid;
        gap: 10px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        width: fit-content;
        padding: 0 14px;
        border-radius: 999px;
        font-weight: 700;
        background: rgba(18, 32, 51, 0.08);
      }

      .status-pill[data-tone="success"] {
        background: var(--success-soft);
        color: var(--success);
      }

      .status-pill[data-tone="error"] {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .results {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .results li {
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 16px;
        background: #fff;
      }

      .results li[data-result="pass"] {
        border-color: rgba(4, 120, 87, 0.22);
        background: var(--success-soft);
      }

      .results li[data-result="fail"] {
        border-color: rgba(180, 35, 24, 0.22);
        background: var(--danger-soft);
      }

      .result-title {
        font-weight: 700;
      }

      .result-detail {
        margin-top: 6px;
        color: var(--muted);
        font-family: "SFMono-Regular", Menlo, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }

      #details {
        min-height: 48px;
        border-radius: 18px;
        border: 1px solid var(--border);
        padding: 14px 16px;
        background: #09111e;
        color: #d7e4ff;
        font-family: "SFMono-Regular", Menlo, monospace;
        font-size: 0.84rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      #mount {
        min-height: 520px;
        border: 1px dashed var(--border);
        border-radius: 24px;
        background: #fff;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel summary">
        <h1>CommerceHub Connect Web SDK Smoke Test</h1>
        <p>
          This harness mounts the shipped bundle into a plain HTML page and drives the required
          parity flows against stubbed API responses.
        </p>
        <div class="status-pill" id="smoke-status" data-tone="idle">Running smoke test...</div>
      </section>

      <section class="panel">
        <h2>Checks</h2>
        <ol class="results" id="results"></ol>
      </section>

      <section class="panel">
        <h2>Details</h2>
        <pre id="details">Waiting for browser activity…</pre>
      </section>

      <section class="panel">
        <h2>Widget Host</h2>
        <div id="mount"></div>
      </section>
    </main>

    <script src="/dist/CommerceHubConnectSDK.js"></script>
    <script>
      const resultsElement = document.getElementById('results');
      const detailsElement = document.getElementById('details');
      const smokeStatusElement = document.getElementById('smoke-status');
      const mountTarget = document.getElementById('mount');

      let activeInstance = null;

      function setStatus(text, tone) {
        smokeStatusElement.textContent = text;
        smokeStatusElement.dataset.tone = tone;
      }

      function addResult(title, result, detail) {
        const item = document.createElement('li');
        item.dataset.result = result;

        const titleElement = document.createElement('div');
        titleElement.className = 'result-title';
        titleElement.textContent = title;
        item.appendChild(titleElement);

        if (detail) {
          const detailElement = document.createElement('pre');
          detailElement.className = 'result-detail';
          detailElement.textContent = detail;
          item.appendChild(detailElement);
        }

        resultsElement.appendChild(item);
      }

      function setDetails(detail) {
        detailsElement.textContent = detail;
      }

      async function fetchState() {
        const response = await fetch('/__smoke__/state', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Unable to fetch smoke state: ${response.status}`);
        }

        return response.json();
      }

      async function waitFor(description, predicate, timeoutMs = 10000) {
        const startedAt = Date.now();

        while (Date.now() - startedAt < timeoutMs) {
          const value = await predicate();
          if (value) {
            addResult(description, 'pass');
            return value;
          }

          await new Promise((resolve) => setTimeout(resolve, 50));
        }

        throw new Error(`Timed out waiting for: ${description}`);
      }

      function getRequiredElement(selector) {
        const element = mountTarget.querySelector(selector);
        if (!element) {
          throw new Error(`Unable to find element: ${selector}`);
        }
        return element;
      }

      function setInputValue(input, value) {
        input.value = value;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function click(element) {
        element.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }

      async function createInteraction(scenario, allowedTenderTypes = ['CARD', 'BANK_ACCOUNT']) {
        const response = await fetch('/merchant/interaction/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
          },
          body: JSON.stringify({
            sessionReferenceId: scenario,
            authType: 'FINAL_SALE',
            email: 'smoke@example.com',
            allowedTenderTypes,
            wallet: true,
          }),
        });

        if (!response.ok) {
          throw new Error(`interaction/create failed with ${response.status}`);
        }

        return response.json();
      }

      async function mountInteraction(interaction, whiteLabel = {}) {
        activeInstance?.destroy();
        activeInstance = await window.CommerceHubConnectWebSdk.mount(
          '#mount',
          {
            interaction,
            configuration: {
              email: 'smoke@example.com',
              wallet: true,
              whiteLabel,
              onSuccess(result) {
                window.__lastSuccessResult = result;
              },
              onError(error) {
                window.__lastError = error;
              },
            },
          },
          'qa',
        );
      }

      async function runOtpAndSavedSourceScenario() {
        const interaction = await createInteraction('saved-source');
        await mountInteraction(interaction, {
          primaryColor: '#ff5a1f',
          secondaryColor: '#1d4ed8',
          textColor: '#101828',
        });

        addResult(
          'Plain HTML host mounted the widget',
          'pass',
          mountTarget.querySelector('.commerce-hub-connect-web-sdk-mount')
            ? 'Inline widget host rendered successfully.'
            : 'Widget host element missing.',
        );

        const mountedHost = mountTarget.querySelector('.commerce-hub-connect-web-sdk-mount');
        const primaryColor = mountedHost?.style.getPropertyValue('--ch-sdk-primary').trim();
        if (primaryColor !== '#ff5a1f') {
          throw new Error(`Expected themed primary color to be #ff5a1f but received ${primaryColor || '(empty)'}`);
        }
        addResult('White-label theme applied', 'pass', `Primary color: ${primaryColor}`);

        const emailInput = getRequiredElement('input[name="email"]');
        setInputValue(emailInput, 'smoke@example.com');
        click(getRequiredElement('button[type="submit"]'));

        await waitFor('OTP send request completed', async () => {
          const state = await fetchState();
          return state.counters['POST /interaction/otp/send'] === 1;
        });

        const otpDigits = await waitFor('Segmented OTP inputs rendered', () => {
          const inputs = mountTarget.querySelectorAll('.ch-sdk-otp-digit');
          return inputs.length === 6 ? inputs : null;
        });
        otpDigits.forEach((input, index) => setInputValue(input, String(index + 1)));
        click(getRequiredElement('button[type="submit"]'));

        await waitFor('OTP validate request completed', async () => {
          const state = await fetchState();
          return state.counters['POST /interaction/otp/validate'] === 1;
        });

        await waitFor('Saved payment sources rendered', () =>
          mountTarget.querySelector('[data-action="select-source"]'),
        );

        click(getRequiredElement('[data-action="select-source"]'));
        click(getRequiredElement('[data-action="attach-selected-source"]'));

        await waitFor('Existing source attach completed', async () => {
          const state = await fetchState();
          return state.counters['POST /interaction/payment-source/card-saved-1/attach'] === 1;
        });

        await waitFor('Existing source success rendered', () =>
          mountTarget.textContent.includes('Visa saved card') || mountTarget.textContent.includes('Payment method saved'),
        );
      }

      async function runAddCardScenario() {
        const interaction = await createInteraction('add-card', ['CARD']);
        await mountInteraction(interaction);

        click(await waitFor('Add card action rendered', () => mountTarget.querySelector('[data-action="add-card"]')));

        setInputValue(getRequiredElement('input[name="name"]'), 'Primary Visa');
        setInputValue(getRequiredElement('input[name="fullName"]'), 'Smoke Tester');
        setInputValue(getRequiredElement('input[name="cardNumber"]'), '4111111111111111');
        setInputValue(getRequiredElement('input[name="expiration"]'), '12/30');
        setInputValue(getRequiredElement('input[name="cvc"]'), '123');
        setInputValue(getRequiredElement('input[name="addressLine1"]'), '123 Main St');
        setInputValue(getRequiredElement('input[name="city"]'), 'New York');
        setInputValue(getRequiredElement('input[name="state"]'), 'NY');
        setInputValue(getRequiredElement('input[name="zip"]'), '10001');
        click(getRequiredElement('form[data-form="card"] button[type="submit"]'));

        await waitFor('Billing address creation completed', async () => {
          const state = await fetchState();
          return state.counters['POST /customer/billing-address'] === 1;
        });

        await waitFor('Card masking requests completed', async () => {
          const state = await fetchState();
          return (
            state.counters['POST /customer/mask/card'] === 1 &&
            state.counters['POST /customer/mask/cvv'] === 1
          );
        });

        await waitFor('Card source creation completed', async () => {
          const state = await fetchState();
          return state.counters['POST /customer/source'] === 1;
        });

        await waitFor('Created card attach completed', async () => {
          const state = await fetchState();
          return state.counters['POST /interaction/payment-source/card-created-1/attach'] === 1;
        });
      }

      async function runBankScenario() {
        window.PaymentSDK = {
          init(configuration) {
            setTimeout(() => {
              configuration.onEvent({ type: 'success' });
            }, 10);
          },
          destroy() {},
        };

        const interaction = await createInteraction('bank-account', ['BANK_ACCOUNT']);
        await mountInteraction(interaction);

        click(await waitFor('Add bank action rendered', () => mountTarget.querySelector('[data-action="add-bank"]')));

        await waitFor('Pay by Bank session requested', async () => {
          const state = await fetchState();
          return state.counters['GET /pbb/session'] === 1;
        });

        await waitFor('Pay by Bank finalize completed', async () => {
          const state = await fetchState();
          return state.counters['PUT /pbb/session/agg-session-1/p-token-1'] === 1;
        });

        await waitFor('Created bank source attach completed', async () => {
          const state = await fetchState();
          return state.counters['POST /interaction/payment-source/bank-created-1/attach'] === 1;
        });
      }

      async function runDependencyAuditScenario() {
        const response = await fetch('/dist/CommerceHubConnectSDK.js', { cache: 'no-store' });
        const bundle = await response.text();
        const forbidden = ['@angular/', 'primeng', 'primeicons', '@primeuix/', 'zone.js'];
        const matches = forbidden.filter((term) => bundle.includes(term));
        if (matches.length > 0) {
          throw new Error(`Forbidden dependency markers detected: ${matches.join(', ')}`);
        }
        addResult('Shipped bundle excludes Angular/Prime/PrimeNG markers', 'pass', forbidden.join(', '));
      }

      async function runSmoke() {
        try {
          if (!window.CommerceHubConnectWebSdk) {
            throw new Error('window.CommerceHubConnectWebSdk is not available.');
          }

          setDetails('Running saved-source, add-card, bank-account, and dependency-audit checks…');

          await runOtpAndSavedSourceScenario();
          await runAddCardScenario();
          await runBankScenario();
          await runDependencyAuditScenario();

          setStatus('Smoke test passed', 'success');
          document.body.dataset.smokeStatus = 'passed';
          setDetails('All smoke scenarios completed successfully.');
        } catch (error) {
          setStatus('Smoke test failed', 'error');
          document.body.dataset.smokeStatus = 'failed';
          const detail = error instanceof Error ? `${error.message}\n\n${error.stack || ''}` : String(error);
          addResult('Smoke test failed', 'fail', detail);
          setDetails(detail);
        } finally {
          activeInstance?.destroy();
        }
      }

      void runSmoke();
    </script>
  </body>
</html>
