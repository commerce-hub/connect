<main class="binding-fixture-shell">
  <section class="binding-fixture-card">
    <h1>Commerce Hub Angular binding fixture</h1>
    <p>
      This page is a verification fixture for the Angular wrapper over the framework-agnostic web
      SDK.
    </p>
    <div id="angular-binding-status" [attr.data-angular-binding-status]="status()">
      {{ message() }}
    </div>
  </section>

  <section id="binding-fixture" class="binding-fixture-card">
    <commerce-hub-connect-web-sdk
      *ngIf="bindingMounted()"
      [interaction]="interaction()"
      [configuration]="configuration()"
      [whiteLabel]="whiteLabel()"
      [environment]="environment()"
    ></commerce-hub-connect-web-sdk>
  </section>
</main>
