variables:
  js_image: "fmk-prod.nexus-ci.onefiserv.net/fmk/tools/aws-cdk-node-python-java:FMK-25-09-10"
  DOCKER_DIND_BASE: "fmk.nexus.onefiserv.net/fmk/ext-tools/fmk-dind:FMK-07-01-24"
  DESTINATION_NEXUS: "fmk.nexus-ci.onefiserv.net"


stages:
  - build
  - dockerize

build_web_sdk:
  image: $js_image
  stage: build
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    paths:
      - .npm/
  script:
    - npm ci
    - npm run build:web-sdk-widget
    - npm run test:web-sdk-smoke
  artifacts:
    paths:
      - projects/commerce-hub-connect-web-sdk/dist/CommerceHubConnectSDK.js
      - projects/commerce-hub-connect-web-sdk/dist/CommerceHubConnectSDK.d.ts
      - projects/commerce-hub-connect-web-sdk/dist/3rdpartylicenses.txt
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - angular.json
        - package.json
        - package-lock.json
        - tsconfig*.json
        - scripts/build-web-sdk-widget.mjs
        - scripts/run-web-sdk-browser-smoke-test.mjs
        - projects/commerce-hub-connect-web-sdk/**/*
        - projects/commerce-hub-connect-sdk/**/*

dockerize:
  stage: dockerize
  tags:
    - docker
  image: $DOCKER_DIND_BASE
  services:
    - name: $DOCKER_DIND_BASE
      alias: "docker"
  needs:
    - job: build_web_sdk
      artifacts: true
      optional: true
  before_script:
    - if ! command -v docker >/dev/null 2>&1; then echo "Docker CLI not found"; exit 1; fi
    - |
      echo "Waiting for Docker daemon..."
      retries=60
      until docker info >/dev/null 2>&1; do
        retries=$((retries-1))
        if [ "$retries" -le 0 ]; then
          echo "Docker daemon did not become ready in time"
          docker version || true
          exit 1
        fi
        sleep 2
      done
    - echo "$OPENFX_NEXUS_PASSWORD_PROD" | docker login -u "$OPENFX_NEXUS_USER_PROD" "$DESTINATION_NEXUS" --password-stdin
  script:
    - |
      set -euo pipefail

      VERSION="$(date +%Y%m%d%H%M%S)"
      echo "New version: $VERSION"

      docker build -f ./Dockerfile -t "apm/0008175/development/${CI_PROJECT_NAME}:${VERSION}" .

      docker tag "apm/0008175/development/${CI_PROJECT_NAME}:${VERSION}" \
                 "${DESTINATION_NEXUS}/apm/0008175/development/${CI_PROJECT_NAME}:${VERSION}"
      docker push "${DESTINATION_NEXUS}/apm/0008175/development/${CI_PROJECT_NAME}:${VERSION}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
