stages:
  - build

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key: npm-${CI_PROJECT_ID}
    paths:
      - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CHROME_BIN: "/usr/bin/chromium"

.web_sdk_changes: &web_sdk_changes
  - angular.json
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.app.json
  - tsconfig.spec.json
  - scripts/build-web-sdk-widget.mjs
  - scripts/run-web-sdk-browser-smoke-test.mjs
  - projects/commerce-hub-connect-sdk/**/*
  - projects/commerce-hub-connect-web-sdk/**/*

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

build_web_sdk:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends chromium
    - npm ci --cache .npm --prefer-offline
  script:
    # The smoke test rebuilds the final browser bundle before validating it.
    - npm run test:web-sdk-smoke
  artifacts:
    name: commerce-hub-connect-web-sdk-$CI_COMMIT_REF_SLUG
    expire_in: 30 days
    paths:
      - projects/commerce-hub-connect-web-sdk/dist/CommerceHubConnectSDK.js
      - projects/commerce-hub-connect-web-sdk/dist/CommerceHubConnectSDK.d.ts
      - projects/commerce-hub-connect-web-sdk/dist/3rdpartylicenses.txt
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *web_sdk_changes
    - if: $CI_COMMIT_BRANCH
      changes: *web_sdk_changes
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
