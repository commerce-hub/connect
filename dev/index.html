<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>CommerceHub Connect Demo</title>
    <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="../node_modules/lit/polyfill-support.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #edf2f7;
        padding: 32px;
        font-family: 'Open Sans', Arial, sans-serif;
        color: #101828;
      }

      .demo-layout {
        width: min(1080px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(360px, 480px) minmax(320px, 1fr);
        gap: 24px;
        align-items: start;
      }

      .demo-widget-panel {
        display: grid;
        gap: 16px;
      }

      .payload-panel {
        display: grid;
        gap: 16px;
      }

      .payload-card {
        background: #ffffff;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        box-shadow: 0 12px 24px rgba(16, 24, 40, 0.08);
        overflow: hidden;
      }

      .payload-card h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #e4e7ec;
        font-size: 15px;
        line-height: 1.4;
      }

      .form-body {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      .field-label {
        font-size: 13px;
        font-weight: 700;
        line-height: 18px;
      }

      textarea {
        min-height: 300px;
        resize: vertical;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
        color: #101828;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      textarea:focus {
        border-color: #003de6;
        outline: 3px solid #dbe7ff;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
      }

      .primary-button {
        border: 1px solid #003de6;
        border-radius: 8px;
        padding: 9px 14px;
        background: #003de6;
        color: #ffffff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        line-height: 18px;
        cursor: pointer;
      }

      .primary-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .error-message {
        min-height: 18px;
        color: #b42318;
        font-size: 13px;
        line-height: 18px;
      }

      .scenario-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 16px;
      }

      .scenario-controls button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
        color: #101828;
        font: inherit;
        font-size: 13px;
        line-height: 18px;
        cursor: pointer;
      }

      .scenario-controls button[aria-pressed='true'] {
        border-color: #003de6;
        background: #eff4ff;
        color: #003de6;
        font-weight: 700;
      }

      pre {
        margin: 0;
        padding: 16px;
        max-height: 360px;
        overflow: auto;
        background: #0f172a;
        color: #e2e8f0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }

      @media (max-width: 860px) {
        .demo-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-layout">
      <section class="demo-widget-panel">
        <div id="connect-widget-host"></div>

        <article class="payload-card">
          <h2>Scenario</h2>
          <div class="scenario-controls" id="scenario-controls">
            <button type="button" data-scenario="otpPending">
              OTP pending
            </button>
            <button type="button" data-scenario="otpFailed">OTP failed</button>
            <button type="button" data-scenario="savedPaymentMethods">
              Saved methods
            </button>
            <button type="button" data-scenario="noSavedPaymentMethods">
              No saved methods
            </button>
          </div>
        </article>
      </section>

      <section class="payload-panel" aria-label="Host integration payloads">
        <article class="payload-card">
          <h2>Create interaction request</h2>
          <form id="interaction-create-form">
            <div class="form-body">
              <label class="field-label" for="interaction-request">
                Request body
              </label>
              <textarea id="interaction-request" spellcheck="false"></textarea>
              <div class="error-message" id="interaction-request-error"></div>
              <div class="form-actions">
                <button
                  class="primary-button"
                  id="create-interaction-button"
                  type="submit"
                >
                  Create interaction
                </button>
              </div>
            </div>
          </form>
        </article>

        <article class="payload-card">
          <h2>Input: interactionResponse</h2>
          <pre id="interaction-input"></pre>
        </article>

        <article class="payload-card">
          <h2>Events</h2>
          <pre>This SDK slice does not emit onSuccess or onError.</pre>
        </article>
      </section>
    </main>

    <script type="module">
      const savedSources = [
        {
          tenderType: 'Card',
          id: 'card-1',
          name: 'Corporate card',
          verificationInfo: {status: 'VERIFIED'},
          card: {
            network: 'Visa',
            cardNumber: '4111111111114242',
          },
        },
        {
          tenderType: 'BankAccount',
          id: 'bank-1',
          name: 'Operating account',
          verificationInfo: {status: 'UNDER_REVIEW'},
          bankAccount: {
            bankName: 'Commerce National Bank',
            accountNumber: '9876543210',
          },
        },
      ];

      const scenarios = {
        otpPending: {
          interactionId: 'demo-interaction-otp-pending',
          status: 'OTP_VALIDATION_PENDING',
          email: 'wallet@example.com',
          allowedTenderTypes: ['CARD', 'BANK_ACCOUNT', 'DYNAMIC_SESSION_CARD'],
        },
        otpFailed: {
          interactionId: 'demo-interaction-otp-failed',
          status: 'OTP_VALIDATION_FAILED',
          email: 'wallet@example.com',
          allowedTenderTypes: ['CARD', 'BANK_ACCOUNT', 'DYNAMIC_SESSION_CARD'],
        },
        savedPaymentMethods: {
          interactionId: 'demo-interaction-saved-methods',
          status: 'PAYMENT_SOURCE_REQUESTED',
          email: 'wallet@example.com',
          allowedTenderTypes: ['CARD', 'BANK_ACCOUNT', 'DYNAMIC_SESSION_CARD'],
          selectedSource: {
            tenderType: 'Card',
            id: 'card-1',
            name: 'Corporate card',
          },
          paymentSources: savedSources,
        },
        noSavedPaymentMethods: {
          interactionId: 'demo-interaction-no-saved-methods',
          status: 'PAYMENT_SOURCE_REQUESTED',
          email: 'wallet@example.com',
          allowedTenderTypes: ['CARD', 'BANK_ACCOUNT', 'DYNAMIC_SESSION_CARD'],
          paymentSources: [],
        },
      };

      const widgetHost = document.querySelector('#connect-widget-host');
      const input = document.querySelector('#interaction-input');
      const createForm = document.querySelector('#interaction-create-form');
      const requestInput = document.querySelector('#interaction-request');
      const requestError = document.querySelector('#interaction-request-error');
      const createButton = document.querySelector('#create-interaction-button');
      const scenarioControls = document.querySelector('#scenario-controls');
      const format = (value) => JSON.stringify(value, null, 2);
      let widget;

      const initialInteractionRequest = {
        sessionReferenceId: 'angular-binding-example-1778790276183',
        authType: 'FINAL_SALE',
        email: 'neer.patel@fiserv.com',
        allowedTenderTypes: ['CARD', 'BANK_ACCOUNT'],
        merchantData: {
          clientId: 'marriot',
          merchantId: '101475000000009',
          terminalId: '10000001',
        },
        wallet: true,
        allowEmailChange: true,
      };
      const commerceHubApiBaseUrl =
        new URLSearchParams(window.location.search).get('apiBaseUrl') ??
        'http://localhost:8080';

      const createApiUrl = (path) =>
        new URL(path, commerceHubApiBaseUrl).toString();

      const createInitialInteractionResponse = async (interactionRequest) => {
        const response = await fetch(
          createApiUrl('/merchant/interaction/create'),
          {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(interactionRequest),
          }
        );
        const responseBody = await readJson(response);

        if (response.ok) {
          return responseBody;
        }

        throw new Error(apiErrorMessage(responseBody));
      };

      const initializeWidget = async (interactionResponse) => {
        await import('../commerce-hub-connect.js');

        widget = document.createElement('commerce-hub-connect');
        widget.id = 'connect-widget';
        widget.interactionResponse = interactionResponse;
        widgetHost.replaceChildren(widget);
        input.textContent = format(interactionResponse);
      };

      const setInteractionResponse = (interactionResponse) => {
        input.textContent = format(interactionResponse);

        if (widget) {
          widget.interactionResponse = interactionResponse;
        }
      };

      const setActiveScenario = (name) => {
        scenarioControls.querySelectorAll('button').forEach((button) => {
          button.setAttribute(
            'aria-pressed',
            button.dataset.scenario === name ? 'true' : 'false'
          );
        });
      };

      const setScenario = async (name) => {
        const interactionResponse = structuredClone(scenarios[name]);

        if (widget) {
          setInteractionResponse(interactionResponse);
        } else {
          await initializeWidget(interactionResponse);
        }

        setActiveScenario(name);
      };

      const readJson = async (response) => {
        const text = await response.text();

        return text ? JSON.parse(text) : undefined;
      };

      const apiErrorMessage = (error) => {
        if (typeof error === 'string') {
          return error;
        }

        if (
          error &&
          typeof error === 'object' &&
          'message' in error &&
          typeof error.message === 'string'
        ) {
          return error.message;
        }

        return 'CommerceHub API request failed.';
      };

      const setCreatePending = (isPending) => {
        createButton.disabled = isPending;
        createButton.textContent = isPending
          ? 'Creating...'
          : 'Create interaction';
      };

      const handleCreateSubmit = async (event) => {
        event.preventDefault();

        requestError.textContent = '';
        input.textContent = 'Creating merchant interaction...';
        setCreatePending(true);

        try {
          const interactionRequest = JSON.parse(requestInput.value);
          const interactionResponse = await createInitialInteractionResponse(
            interactionRequest
          );

          await initializeWidget(interactionResponse);
          setActiveScenario();
        } catch (error) {
          const message =
            error instanceof SyntaxError
              ? 'Request body must be valid JSON.'
              : error instanceof Error
              ? error.message
              : 'CommerceHub API request failed.';

          requestError.textContent = message;
          input.textContent = format({message});
        } finally {
          setCreatePending(false);
        }
      };

      const initializeDemo = () => {
        requestInput.value = format(initialInteractionRequest);
        input.textContent = format({
          message: 'Submit the create request to see the interactionResponse.',
        });
        setActiveScenario();
      };

      createForm.addEventListener('submit', (event) => {
        void handleCreateSubmit(event);
      });

      scenarioControls.addEventListener('click', (event) => {
        const button = event.target.closest('[data-scenario]');

        if (button) {
          void setScenario(button.dataset.scenario);
        }
      });

      initializeDemo();
    </script>
  </body>
</html>
